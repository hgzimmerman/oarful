[workspace]
resolver = "2"
members = [
    "crates/db",
    "crates/master_db",
    "crates/solver",
    "crates/sheets",
    "crates/server",
    "crates/cli",
    "e2e",
]
default-members = ["crates/cli", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }

diesel = { version = "2.3", features = ["sqlite", "chrono", "returning_clauses_for_sqlite_3_35"] }
diesel-derive-enum = { version = "2.1", features = ["sqlite"] }
diesel-derive-newtype = "2.1"
diesel_migrations = "2.3"
deadpool-diesel = { version = "0.5", features = ["sqlite"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# Constraint solver. We pull in pumpkin-core directly (rather than the
# higher-level `pumpkin-solver` crate) to sidestep its `cc`/`vergen-gix`
# build.rs — we only need the library API, not the FlatZinc binary frontend.
pumpkin-core = "0.3"
pumpkin-constraints = "0.3"
pumpkin-conflict-resolvers = "0.3"

# Google Sheets sync. v1 reads a publicly-shared sheet via its CSV
# export URL, so we only need an HTTP client + CSV parser. For private
# sheets we'd add google-sheets4 + yup-oauth2 later; kept commented
# out so the version baseline is documented.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
csv = "1.3"
# google-sheets4 = "7"   # future: authenticated sheets
# yup-oauth2 = "12"      # future: service-account auth

# lineup_server (milestone 5) — axum/maud/htmx stack. Declared centrally
# so the server crate inherits versions via `workspace = true`.
rayon = "1"
bcrypt = "0.17"
jsonwebtoken = "9"
axum = { version = "0.8", features = ["multipart"] }
maud = { version = "0.26", features = ["axum"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
axum-htmx = "0.8"
axum-extra = { version = "0.10", features = ["cookie", "query"] }
async-trait = "0.1"
time = "0.3"
sha2 = "0.10"
hex = "0.4"
test-case = "3"
rand = "0.8"

# Local crates
lineup_db = { path = "crates/db" }
lineup_master_db = { path = "crates/master_db" }
lineup_solver = { path = "crates/solver" }
lineup_sheets = { path = "crates/sheets" }

# Optimize the solver and its CP backend in dev builds so solve
# times are representative. Everything else stays at opt-level 0
# for fast compiles.
[profile.dev.package.lineup_solver]
opt-level = 2
[profile.dev.package.pumpkin-core]
opt-level = 2
[profile.dev.package.pumpkin-constraints]
opt-level = 2
[profile.dev.package.pumpkin-conflict-resolvers]
opt-level = 2
