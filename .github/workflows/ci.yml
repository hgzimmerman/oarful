name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-progress runs for the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check formatting
        run: nix develop -c cargo fmt --all -- --check

      - name: Clippy
        run: nix develop -c cargo clippy --workspace -- -D warnings

      - name: Tailwind CSS freshness
        run: |
          nix develop -c tailwindcss -i tailwind.input.css -o crates/server/public/tailwind.css --minify
          git diff --exit-code crates/server/public/tailwind.css

  test-unit:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run tests (excluding e2e)
        run: nix develop -c cargo test --workspace --exclude lineup_e2e

  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    env:
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run e2e tests
        run: |
          cat > /tmp/dbus-session.conf <<DBUS_CONF
          <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
           "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
          <busconfig>
            <type>custom</type>
            <listen>unix:tmpdir=/tmp</listen>
            <auth>EXTERNAL</auth>
            <policy context="default">
              <allow send_destination="*" eavesdrop="true"/>
              <allow eavesdrop="true"/>
              <allow own="*"/>
            </policy>
          </busconfig>
          DBUS_CONF
          nix develop -c bash -c '
            eval $(dbus-daemon --config-file=/tmp/dbus-session.conf --fork --print-address=1 --print-pid=1 | { read addr; read pid; echo "export DBUS_SESSION_BUS_ADDRESS=$addr DBUS_PID=$pid"; })
            cargo nextest run -p lineup_e2e --retries 2 -j 4 --no-fail-fast
            kill $DBUS_PID 2>/dev/null || true
          '

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build Docker image
        run: nix build .#docker
