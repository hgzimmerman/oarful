app = "lineup-generator"
primary_region = "iad"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  MASTER_DB = "/data/master.db"
  DATA_DIR = "/data"
  PUBLIC_DIR = "/app/public"
  RUST_LOG = "info,lineup_server=debug"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "data"
  destination = "/data"
